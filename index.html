<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>姚煜坤 · 每周课程表</title>
<style>
:root{--navy:#173f67;--blue:#eaf4fb;--accent:#1e78b8;--line:#d5e1eb;--text:#17212b;--muted:#667788}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif}main{max-width:1260px;margin:auto;padding:30px 18px 48px}.hero{padding:27px 30px;border-radius:17px;background:linear-gradient(135deg,#173f67,#246eaa);color:#fff}h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;opacity:.88}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:23px 0 14px}select,button{font:inherit;border-radius:8px;padding:9px 12px}select{border:1px solid var(--line);background:#fff}button{border:0;background:var(--navy);color:#fff;cursor:pointer}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.note{margin-left:auto;font-size:14px;color:var(--muted)}.grid-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.grid{width:100%;min-width:920px;border-collapse:collapse;table-layout:fixed}.grid th{padding:13px 10px;background:var(--blue);color:var(--navy);border-right:1px solid var(--line);font-size:16px}.grid th:first-child{width:136px}.grid th:last-child{border-right:0}.date{display:block;margin-top:3px;font-size:12px;font-weight:400;color:var(--muted)}.grid td{height:76px;padding:7px 9px;border-top:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}.grid td:last-child{border-right:0}.period{background:#f8fbfd;color:var(--navy);font-weight:700;font-size:14px;vertical-align:middle!important}.period small{display:block;margin-top:4px;color:var(--muted);font-weight:400;font-size:12px}.slot{white-space:pre-wrap;line-height:1.45;font-size:13px;cursor:text}.slot:focus{outline:3px solid #9dc8e7;background:#f8fcff}.slot:not(:empty){background:#f4faff}.hint{margin:14px 2px 0;color:var(--muted);font-size:13px}.saved{color:#277548;font-size:13px;font-weight:700}@media(max-width:600px){main{padding:18px 10px}.hero{padding:22px 20px;border-radius:12px}h1{font-size:23px}.note{margin-left:0;width:100%}}
</style></head>
<body><main>
<section class="hero"><h1>每周课程表</h1><p>第一周从 2026 年 8 月 31 日（周一）开始。点击任一格子即可编辑。</p></section>
<div class="controls"><label>当前周次 <select id="week" aria-label="选择周次"></select></label><button id="clear" class="secondary" type="button">清空本周编辑内容</button><span class="note" id="status" aria-live="polite">修改会自动保存</span></div>
<div class="grid-wrap"><table class="grid" aria-label="每周课程网格"><thead><tr><th>节次与时间</th><th id="h0"></th><th id="h1"></th><th id="h2"></th><th id="h3"></th><th id="h4"></th></tr></thead><tbody id="body"></tbody></table></div>
<p class="hint">每个课程格均可直接输入或删除内容；保存的数据仅存于当前浏览器。切换周次时可查看和编辑不同周的课表。</p>
</main><script>
const days=['星期一','星期二','星期三','星期四','星期五'];
const periods={1:'08:00–08:45',2:'08:50–09:35',3:'09:55–10:40',4:'10:45–11:30',5:'13:40–14:25',6:'14:30–15:15',7:'15:35–16:20',8:'16:25–17:10',9:'18:00–18:45',10:'18:50–19:35',11:'19:40–20:25',12:'20:30–21:15'};
const courses=[
['林业工程理论与技术（1班）','星期四',1,4,'李淑君','丹青楼425','7-14'],['林业工程安全教育（1班）','星期一',3,4,'苗媛媛','奥林301','3-4'],['林业工程安全教育（1班）','星期一',3,4,'尹冉','奥林301','5'],['林业工程安全教育（1班）','星期三',3,4,'苗媛媛','奥林301','3'],['林业工程安全教育（1班）','星期三',3,4,'尹冉','奥林301','4-5'],['家具力学有限元分析及优化设计（1班）','星期二',5,8,'徐淑艳','家居学院楼204','4-7'],['林业工程科技英语（1班）','星期四',5,8,'王璐瑶','丹青楼401','17'],['家具力学有限元分析及优化设计（1班）','星期四',5,8,'徐淑艳','家居学院楼204','4-7'],['林业工程安全教育（1班）','星期一',9,12,'苗媛媛','奥林301','17'],['林业工程科技英语（1班）','星期一',9,12,'王璐瑶','丹青楼401','13-16'],['高等材料科学（1班）','星期一',9,12,'刘志明','奥林201','3-4'],['高等材料科学（1班）','星期一',9,12,'王翔宇','奥林201','5,7'],['林业工程科技英语（1班）','星期二',9,12,'王睿文','丹青楼401','3-5,7-9'],['高等材料科学（1班）','星期三',9,12,'刘志明','奥林201','3-4'],['高等材料科学（1班）','星期三',9,12,'王翔宇','奥林201','5,7'],['林业工程科技英语（1班）','星期五',9,12,'孔德功','丹青楼401','10-14']
].map(([name,day,start,end,teacher,place,weeks])=>({name,day,start,end,teacher,place,weeks}));
const week=document.querySelector('#week'),body=document.querySelector('#body'),status=document.querySelector('#status');for(let i=1;i<=17;i++)week.add(new Option(`第 ${i} 周`,i));
function inWeeks(n,p){return p.split(',').some(x=>{const[a,b]=x.trim().split('-').map(Number);return b?n>=a&&n<=b:n===a})}
function getDate(n,day){const d=new Date('2026-08-31T00:00:00');d.setDate(d.getDate()+(n-1)*7+day);return d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'})}
function key(w,d,p){return `yao-grid-${w}-${d}-${p}`}function defaultText(w,d,p){return courses.filter(c=>c.day===days[d]&&p>=c.start&&p<=c.end&&inWeeks(w,c.weeks)).map(c=>`${c.name}\n${c.teacher} · ${c.place}\n第${c.weeks}周`).join('\n\n')}
function updateHeaders(w){days.forEach((d,i)=>document.querySelector(`#h${i}`).innerHTML=`${d}<span class="date">${getDate(w,i)}</span>`)}
function render(){const w=+week.value;updateHeaders(w);body.innerHTML=Array.from({length:12},(_,i)=>{const p=i+1;return `<tr><td class="period">第 ${p} 节<small>${periods[p]}</small></td>${days.map((_,d)=>{const saved=localStorage.getItem(key(w,d,p));const text=saved===null?defaultText(w,d,p):saved;return `<td class="slot" contenteditable="true" data-day="${d}" data-period="${p}" spellcheck="false">${text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</td>`}).join('')}</tr>`}).join('')}
body.addEventListener('input',e=>{if(!e.target.classList.contains('slot'))return;const k=key(+week.value,e.target.dataset.day,e.target.dataset.period);localStorage.setItem(k,e.target.innerText.replace(/\n$/,''));status.textContent='已自动保存';status.className='note saved';setTimeout(()=>{status.textContent='修改会自动保存';status.className='note'},1200)});
week.addEventListener('change',render);document.querySelector('#clear').addEventListener('click',()=>{if(!confirm('确定清空本周所有格子的编辑内容吗？'))return;for(let d=0;d<5;d++)for(let p=1;p<=12;p++)localStorage.setItem(key(+week.value,d,p),'');render()});render();
</script></body></html>
